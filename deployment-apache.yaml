apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-waf
  namespace: grupob3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-waf
  template:
    metadata:
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs.paths: /var/log/apache2/*.log        

        co.elastic.logs/module: apache
        co.elastic.logs.fileset.access.enabled: "true"
        co.elastic.logs.fileset.error.enabled: "true"
        co.elastic.logs/processors.add_fields.fields.service: apache-waf
        co.elastic.logs/processors.add_fields.fields.env: grupob3
      labels:
        app: apache-waf
        env: grupob3
    spec:
      containers:
        - name: apache
          ports:
             - containerPort: 80
          image: grupob3/pepsapachewaf:1.3

---
apiVersion: v1
kind: Service
metadata:
  name: apache-waf
  namespace: grupob3
spec:
  type: NodePort
  ports:
    - port: 80
      nodePort: 30703
  selector:
    app: apache-waf
